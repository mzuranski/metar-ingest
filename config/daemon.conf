# Daemon configuration

[daemon]
pidfile = /var/run/metar-ingest.pid
user = ldm
group = ldm
working_directory = /home/ldm/scripts/obs/metar
umask = 0o022

[Unit]
Description=METAR Data Ingestion Daemon
After=network.target

[Service]
Type=simple
User=ldm
WorkingDirectory=/home/ldm/scripts/obs/metar/src
ExecStart=python3 main.py
Restart=on-failure
Environment=PYTHONUNBUFFERED=1

[Install]
WantedBy=multi-user.target