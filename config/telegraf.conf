# Telegraf configuration for METAR ingestion metrics

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = ""
  omit_hostname = false

# PostgreSQL input plugin for metrics
[[inputs.postgresql_extensible]]
  address = "host=localhost user=metar_user password=changeme dbname=metar_obs sslmode=disable"
  
  # Query recent metrics (last hour)
  [[inputs.postgresql_extensible.query]]
    sqlquery = """
      SELECT 
        EXTRACT(EPOCH FROM metric_time)::bigint as time,
        SUM(total_received) as total_received,
        SUM(successfully_parsed) as successfully_parsed,
        SUM(parse_failures) as parse_failures,
        SUM(database_errors) as database_errors,
        AVG(processing_time_ms) as avg_processing_time_ms
      FROM ingest_metrics
      WHERE metric_time >= NOW() - INTERVAL '1 hour'
      GROUP BY DATE_TRUNC('minute', metric_time), metric_time
      ORDER BY metric_time DESC
      LIMIT 60
    """
    version = 901
    withdbname = false
    tagvalue = ""
    measurement = "metar_ingest"

  # Query observation counts by hour
  [[inputs.postgresql_extensible.query]]
    sqlquery = """
      SELECT 
        EXTRACT(EPOCH FROM DATE_TRUNC('hour', observation_time))::bigint as time,
        COUNT(*) as observation_count,
        COUNT(DISTINCT station_id) as unique_stations
      FROM observations
      WHERE observation_time >= NOW() - INTERVAL '24 hours'
      GROUP BY DATE_TRUNC('hour', observation_time)
      ORDER BY time DESC
    """
    version = 901
    withdbname = false
    tagvalue = ""
    measurement = "metar_observations"

# Output to InfluxDB v2
[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "5s"